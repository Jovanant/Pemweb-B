<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .rainbow {
      height: 4px;
      border: 0;
      opacity: 1;
      background: linear-gradient(to right, #b5d86b, #f5f5a0, #f9c35a, #ef7b6b, #c9a0dc, #6fa0dc, #6cc3e0);
    }
  </style>
</head>
<body class="bg-light">
  <div class="container my-5" style="max-width: 560px;">
    <div class="card"><div class="card-body p-4">

      <h3>Please Sign Up <small class="text-muted fs-6">It's free and always will be.</small></h3>
      <hr class="rainbow">

      <form>
        <div class="row mb-3">
          <div class="col"><input type="text" class="form-control form-control-lg" placeholder="First Name" required></div>
          <div class="col"><input type="text" class="form-control form-control-lg" placeholder="Last Name" required></div>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control form-control-lg" placeholder="Display Name" required>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control form-control-lg" placeholder="Email Address" required>
        </div>
        <div class="row mb-3">
          <div class="col"><input type="password" class="form-control form-control-lg" placeholder="Password" required></div>
          <div class="col"><input type="password" class="form-control form-control-lg" placeholder="Confirm Password" required></div>
        </div>

        <div class="row align-items-center mb-3">
          <div class="col-4">
            <div class="form-check border rounded p-2 ps-5">
              <input class="form-check-input" type="checkbox" id="agree" required>
              <label class="form-check-label" for="agree">I Agree</label>
            </div>
          </div>
          <div class="col-8 small">
            By clicking <span class="badge bg-primary">Register</span>, you agree to the
            <a href="#">Terms and Conditions</a> set out by this site, including our Cookie Use.
          </div>
        </div>

        <hr class="rainbow">

        <div class="row">
          <div class="col"><button type="submit" class="btn btn-primary btn-lg w-100">Register</button></div>
          <div class="col"><a href="login.html" class="btn btn-success btn-lg w-100">Sign In</a></div>
        </div>
      </form>

    </div></div>
  </div>
</body>
</html>
