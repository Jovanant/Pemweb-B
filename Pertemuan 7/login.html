<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Ganti dengan foto sendiri: background: url('gambar.jpg') center/cover; */
    .side-image {
      background: linear-gradient(160deg, #0a4fa8, #2f8de4 60%, #bfe0ff);
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">

      <!-- Kiri: gambar -->
      <div class="col-md-6 side-image d-none d-md-block"></div>

      <!-- Kanan: form -->
      <div class="col-md-6 d-flex align-items-center justify-content-center min-vh-100">
        <form class="w-100" style="max-width: 340px;">
          <p class="text-muted">Welcome back!</p>
          <input type="email" class="form-control mb-2" placeholder="Email address" required>
          <input type="password" class="form-control mb-2" placeholder="Password" required>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label small" for="remember">Remember password</label>
          </div>
          <button type="submit" class="btn btn-primary w-100 text-uppercase">Sign in</button>
          <div class="text-center mt-2">
            <a href="register.html" class="small">Forgot password? / Register</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</body>
</html>
